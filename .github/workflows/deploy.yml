name: "CI/CD - Cartório Digital AWS"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Obrigatório para requisitar o OIDC JWT token
  contents: read  # Obrigatório para checkout do código

jobs:
  plan:
    name: "Validar e Planejar Infraestrutura"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Lambda Dependencies
        run: |
          pip install pypdf -t ../src/backend/process_pdf
          find ../src/backend/process_pdf -type d -name "__pycache__" -exec rm -rf {} + || true
        working-directory: .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color

  apply:
    name: "Aprovar e Aplicar Infraestrutura (Apply)"
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production # Exige aprovação manual configurada no ambiente 'production' do GitHub
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Lambda Dependencies
        run: |
          pip install pypdf -t ../src/backend/process_pdf
          find ../src/backend/process_pdf -type d -name "__pycache__" -exec rm -rf {} + || true
        working-directory: .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Deploy Frontend assets to S3
        run: |
          API_ENDPOINT=$(terraform output -raw api_endpoint)
          FRONTEND_BUCKET=$(terraform output -raw s3_frontend_bucket_name)
          echo "{\"api_base_url\": \"$API_ENDPOINT\"}" > ../src/frontend/config.json
          aws s3 sync ../src/frontend/ s3://$FRONTEND_BUCKET/ --delete
        working-directory: ./terraform
